<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140804">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>言霊ランタン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #140804;
      color: #fff6e8;
      font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .screen, .dock, .hud { position: fixed; z-index: 5; }
    .screen {
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        calc(28px + env(safe-area-inset-top))
        24px
        calc(28px + env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 42%, rgba(120, 48, 12, 0.45), rgba(8, 6, 10, 0.92) 72%);
      text-align: center;
      transition: opacity 0.7s ease;
    }
    .screen h1 {
      margin: 8px 0 0;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 500;
      letter-spacing: 0.18em;
    }
    .eyebrow {
      margin: 0;
      font-family: Inter, sans-serif;
      letter-spacing: 0.28em;
      font-size: 11px;
      color: rgba(255, 214, 170, 0.7);
    }
    .lead {
      margin: 0 auto;
      max-width: 22rem;
      line-height: 1.9;
      letter-spacing: 0.08em;
      font-size: 15px;
    }
    .lead span { display: block; margin-top: 8px; color: rgba(255, 220, 180, 0.72); font-size: 13px; }
    .go {
      min-height: 52px;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd7a1, #ff8a3d);
      color: #3a1604;
      letter-spacing: 0.22em;
      font-size: 15px;
    }
    .go:active { transform: scale(0.98); }
    .dock {
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(20, 8, 4, 0), rgba(20, 8, 4, 0.88) 28%);
    }
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
      touch-action: pan-x;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 196, 140, 0.35);
      background: rgba(255, 160, 70, 0.12);
      color: #ffe7c7;
      font-size: 14px;
    }
    .composer {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .composer input {
      flex: 1;
      min-width: 0;
      height: 52px;
      border-radius: 16px;
      border: 1px solid rgba(255, 196, 140, 0.4);
      background: rgba(255, 244, 230, 0.1);
      color: #fff8ef;
      padding: 0 16px;
      font-size: 16px;
      letter-spacing: 0.06em;
      outline: none;
    }
    .composer input:focus { border-color: #ffb15a; background: rgba(255, 244, 230, 0.16); }
    .send {
      height: 52px;
      min-width: 76px;
      padding: 0 16px;
      border: 0;
      border-radius: 16px;
      background: #ffb15a;
      color: #3a1604;
      letter-spacing: 0.14em;
      font-size: 16px;
    }
    .send:active, .chip:active { transform: scale(0.97); }
    .shake { animation: shake 0.35s linear; }
    @keyframes shake {
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .hint {
      margin: 8px 0 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(255, 220, 180, 0.62);
    }
    .hud {
      top: calc(10px + env(safe-area-inset-top));
      right: calc(12px + env(safe-area-inset-right));
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 220, 180, 0.28);
      background: rgba(20, 8, 4, 0.45);
      color: #ffe7c7;
      font-size: 16px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="art"></canvas>

  <section class="screen" id="start">
    <p class="eyebrow">KOTODAMA</p>
    <div>
      <h1>言霊</h1>
      <p class="lead">
        人それぞれの言葉を置くと、<br>嬉しい気持ちがバーッと溢れます。
        <span>画面を触ると、最後の言葉がもう一度光ります。</span>
      </p>
    </div>
    <button class="go" id="startBtn" type="button">言葉を置く</button>
  </section>

  <div class="hud hidden" id="hud">
    <button class="icon-btn" id="soundBtn" type="button" aria-label="音の切り替え">♪</button>
  </div>

  <form class="dock hidden" id="dock">
    <div class="chips" id="chips"></div>
    <div class="composer" id="composer">
      <input id="word" type="text" inputmode="text" enterkeyhint="send" maxlength="24" autocomplete="off" autocapitalize="off" placeholder="言葉を入れてください">
      <button class="send" id="send" type="submit">放つ</button>
    </div>
    <p class="hint">どんな言葉からも、嬉しい気持ちが出てきます</p>
  </form>

  <script>
    const JOY = ["嬉しい", "ありがとう", "大好き", "きらきら", "笑顔", "あったかい", "光", "幸せ", "わーい", "輝く", "ドキドキ", "♡"];
    const STORE = "kotodama-words-v1";

    const canvas = document.getElementById("art");
    const ctx = canvas.getContext("2d");
    const startEl = document.getElementById("start");
    const dock = document.getElementById("dock");
    const hud = document.getElementById("hud");
    const wordInput = document.getElementById("word");
    const chipsEl = document.getElementById("chips");
    const composer = document.getElementById("composer");
    const soundBtn = document.getElementById("soundBtn");

    const state = {
      started: false,
      sound: true,
      warmth: 0.18,
      width: 1,
      height: 1,
      dpr: 1,
      words: []
    };

    const shards = [];
    const sparks = [];
    const cores = [];
    const floaters = [];
    let audioCtx = null;
    let composing = false;
    let shock = 0;

    function resize() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    }

    function loadWords() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE) || "[]");
        state.words = Array.isArray(saved) ? saved.filter((w) => typeof w === "string").slice(0, 16) : [];
      } catch {
        state.words = [];
      }
      state.words.forEach((text, i) => floaters.push(makeFloater(text, i)));
    }

    function saveWords() {
      try { localStorage.setItem(STORE, JSON.stringify(state.words)); } catch { /* private mode */ }
    }

    function renderChips() {
      chipsEl.replaceChildren();
      state.words.forEach((text) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = text;
        btn.addEventListener("click", () => release(text, false));
        chipsEl.appendChild(btn);
      });
    }

    function makeFloater(text, index) {
      return {
        text,
        x: Math.random() * state.width,
        y: state.height * (0.18 + (index % 5) * 0.12),
        vy: -0.12 - Math.random() * 0.22,
        drift: Math.random() * Math.PI * 2,
        alpha: 0.28 + Math.random() * 0.25
      };
    }

    function burst(text, x, y, power) {
      const count = Math.round((widthBusy() ? 22 : 34) * power);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
        const speed = (5.5 + Math.random() * 9) * power;
        const own = i % 3 === 0;
        shards.push({
          text: own ? text : JOY[i % JOY.length],
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          rot: (Math.random() - 0.5) * 0.6,
          vr: (Math.random() - 0.5) * 0.08,
          size: own ? 20 + Math.random() * 8 : 14 + Math.random() * 8,
          hue: own ? 28 : (i % 4 === 0 ? 345 : 18 + Math.random() * 28)
        });
      }
      const sparkCount = Math.round((widthBusy() ? 36 : 70) * power);
      for (let i = 0; i < sparkCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (2 + Math.random() * 11) * power;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.7 + Math.random() * 0.5,
          size: 1.5 + Math.random() * 3.5,
          hue: Math.random() < 0.35 ? 340 : 36
        });
      }
      cores.push({ text, x, y, life: 1, scale: 0.35 });
      shock = Math.max(shock, power);
      while (shards.length > 220) shards.shift();
      while (sparks.length > 320) sparks.shift();
    }

    function widthBusy() {
      return state.width < 760;
    }

    function release(raw, remember) {
      const text = String(raw || "").trim().slice(0, 24);
      if (!text) {
        composer.classList.remove("shake");
        void composer.offsetWidth;
        composer.classList.add("shake");
        wordInput.focus();
        return;
      }
      if (remember) {
        state.words = [text, ...state.words.filter((w) => w !== text)].slice(0, 16);
        saveWords();
        renderChips();
        floaters.unshift(makeFloater(text, 0));
        if (floaters.length > 16) floaters.pop();
        wordInput.value = "";
        wordInput.blur();
      }
      const x = state.width * 0.5;
      const y = state.height * 0.42;
      burst(text, x, y, 1);
      state.warmth = Math.min(1, state.warmth + 0.42);
      playJoy();
    }

    function ensureAudio() {
      if (audioCtx) return audioCtx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      return audioCtx;
    }

    function playJoy() {
      const ctxA = ensureAudio();
      if (!ctxA || !state.sound) return;
      if (ctxA.state === "suspended") ctxA.resume();
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const t = ctxA.currentTime + i * 0.055;
        const osc = ctxA.createOscillator();
        const gain = ctxA.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        osc.connect(gain);
        gain.connect(ctxA.destination);
        osc.start(t);
        osc.stop(t + 0.46);
      });
    }

    function liftDock() {
      const vv = window.visualViewport;
      if (!vv) return;
      const covered = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      dock.style.transform = covered > 0 ? `translateY(-${covered}px)` : "";
    }

    function drawBackground() {
      const w = state.warmth;
      const r = Math.round(10 + 70 * w);
      const g = Math.round(8 + 24 * w);
      const b = Math.round(14 - 8 * w);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(0, 0, state.width, state.height);

      const cx = state.width * 0.5;
      const cy = state.height * 0.46;
      const pulse = 0.82 + Math.sin(performance.now() / 700) * 0.06 + shock * 0.35;
      const radius = Math.max(state.width, state.height) * (0.55 + shock * 0.25);
      const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, radius);
      glow.addColorStop(0, `rgba(255, 214, 150, ${0.55 * pulse * (0.35 + w)})`);
      glow.addColorStop(0.35, `rgba(255, 120, 60, ${0.28 * pulse * (0.3 + w)})`);
      glow.addColorStop(1, "rgba(40, 8, 2, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, state.width, state.height);

      if (shock > 0.02) {
        ctx.beginPath();
        ctx.arc(cx, cy, (1 - shock) * Math.max(state.width, state.height) * 0.72, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 220, 170, ${shock * 0.45})`;
        ctx.lineWidth = 8 * shock + 2;
        ctx.stroke();
      }
    }

    function drawHeart(x, y, size, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, size * 0.35);
      ctx.bezierCurveTo(-size, -size * 0.35, -size * 0.2, -size, 0, -size * 0.35);
      ctx.bezierCurveTo(size * 0.2, -size, size, -size * 0.35, 0, size * 0.35);
      ctx.fill();
      ctx.restore();
    }

    function frame() {
      state.warmth += (0.22 - state.warmth) * 0.004;
      shock *= 0.965;

      drawBackground();

      floaters.forEach((f) => {
        f.drift += 0.01;
        f.x += Math.sin(f.drift) * 0.35;
        f.y += f.vy;
        if (f.y < -30) f.y = state.height + 20;
        ctx.globalAlpha = f.alpha * (0.45 + state.warmth);
        ctx.fillStyle = "#ffe1bf";
        ctx.font = "15px 'Shippori Mincho', serif";
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1;
      });

      for (let i = shards.length - 1; i >= 0; i--) {
        const s = shards[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vx *= 0.985;
        s.vy *= 0.985;
        s.vy -= 0.02;
        s.life -= 0.008;
        s.rot += s.vr;
        if (s.life <= 0) { shards.splice(i, 1); continue; }
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        ctx.globalAlpha = Math.max(0, s.life);
        ctx.fillStyle = `hsl(${s.hue} 95% 72%)`;
        ctx.font = `${s.size}px 'Shippori Mincho', serif`;
        ctx.textAlign = "center";
        ctx.fillText(s.text, 0, 0);
        ctx.restore();
      }

      ctx.globalCompositeOperation = "lighter";
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy = p.vy * 0.98 - 0.03;
        p.life -= 0.012;
        if (p.life <= 0) { sparks.splice(i, 1); continue; }
        if (p.hue > 300) drawHeart(p.x, p.y, p.size * 2.2 * p.life, `hsla(345, 90%, 70%, ${p.life})`);
        else {
          ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.life})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.6 + p.life), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.textAlign = "start";

      for (let i = cores.length - 1; i >= 0; i--) {
        const c = cores[i];
        c.life -= 0.012;
        c.scale += (1.35 - c.scale) * 0.12;
        if (c.life <= 0) { cores.splice(i, 1); continue; }
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.scale, c.scale);
        ctx.globalAlpha = Math.max(0, Math.min(1, c.life * 1.4));
        ctx.fillStyle = "#fff4df";
        ctx.font = "40px 'Shippori Mincho', serif";
        ctx.textAlign = "center";
        ctx.fillText(c.text, 0, 0);
        ctx.restore();
      }

      requestAnimationFrame(frame);
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      state.started = true;
      ensureAudio();
      startEl.style.opacity = "0";
      startEl.style.pointerEvents = "none";
      dock.classList.remove("hidden");
      hud.classList.remove("hidden");
      setTimeout(() => startEl.classList.add("hidden"), 700);
    });

    dock.addEventListener("submit", (e) => {
      e.preventDefault();
      if (composing) return;
      release(wordInput.value, true);
    });

    wordInput.addEventListener("compositionstart", () => { composing = true; });
    wordInput.addEventListener("compositionend", () => { composing = false; });

    soundBtn.addEventListener("click", () => {
      state.sound = !state.sound;
      soundBtn.textContent = state.sound ? "♪" : "×";
      soundBtn.setAttribute("aria-label", state.sound ? "音を消す" : "音を出す");
    });

    canvas.addEventListener("pointerdown", (e) => {
      if (!state.started) return;
      const text = state.words[0] || "嬉しい";
      burst(text, e.clientX, e.clientY, 0.72);
      state.warmth = Math.min(1, state.warmth + 0.18);
      playJoy();
    });

    window.addEventListener("resize", resize);
    window.visualViewport?.addEventListener("resize", liftDock);
    window.visualViewport?.addEventListener("scroll", liftDock);

    resize();
    loadWords();
    renderChips();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
