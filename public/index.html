<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140804">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="言霊">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>言霊ランタン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden;
      background: #070b14; color: #f6efe4;
      font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
      touch-action: manipulation; overscroll-behavior: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .screen {
      position: fixed; inset: 0; z-index: 6;
      display: flex; flex-direction: column; justify-content: space-between; text-align: center;
      padding: calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 40%, rgba(90, 40, 12, 0.35), rgba(5, 8, 16, 0.94) 70%);
      transition: opacity 0.8s ease;
    }
    .eyebrow { margin: 0; font-family: Inter, sans-serif; letter-spacing: 0.32em; font-size: 11px; color: rgba(186, 230, 253, 0.7); }
    h1 { margin: 10px 0 0; font-weight: 500; letter-spacing: 0.22em; font-size: clamp(28px, 8vw, 46px); }
    .lead { margin: 0 auto; max-width: 22rem; line-height: 1.95; letter-spacing: 0.08em; font-size: 15px; }
    .lead span { display: block; margin-top: 10px; color: rgba(255, 214, 170, 0.78); font-size: 13px; }
    .go {
      min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px;
      background: linear-gradient(180deg, #ffe0b0, #ff8d3a); color: #3a1604; letter-spacing: 0.22em; font-size: 15px;
    }
    .hud, .dock, .install { position: fixed; z-index: 5; }
    .hud { top: calc(10px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); display: flex; gap: 8px; }
    .icon {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255, 220, 180, 0.28); background: rgba(8, 10, 16, 0.45); color: #ffe7c7; font-size: 14px;
    }
    .dock {
      left: 0; right: 0; bottom: 0;
      padding: 8px 14px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(6, 8, 14, 0), rgba(6, 8, 14, 0.9) 30%);
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; touch-action: pan-x; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; min-height: 44px; padding: 0 14px; border-radius: 999px;
      border: 1px solid rgba(255, 196, 140, 0.35); background: rgba(255, 150, 60, 0.12); color: #ffe7c7; font-size: 14px;
    }
    .composer { display: flex; gap: 8px; }
    .composer input {
      flex: 1; min-width: 0; height: 52px; border-radius: 16px; font-size: 16px; letter-spacing: 0.06em;
      border: 1px solid rgba(255, 196, 140, 0.4); background: rgba(255, 244, 230, 0.1); color: #fff8ef; padding: 0 16px; outline: none;
    }
    .send { height: 52px; min-width: 76px; border: 0; border-radius: 16px; background: #ffb15a; color: #3a1604; letter-spacing: 0.12em; font-size: 16px; }
    .hint { margin: 8px 0 0; text-align: center; font-size: 12px; letter-spacing: 0.08em; color: rgba(255, 220, 180, 0.66); }
    .install {
      left: 12px; right: 12px; bottom: calc(128px + env(safe-area-inset-bottom));
      padding: 12px 14px; border-radius: 16px; background: rgba(12, 10, 8, 0.82);
      border: 1px solid rgba(255, 196, 140, 0.3); font-size: 13px; line-height: 1.6;
    }
    .install button { margin-top: 8px; min-height: 40px; border-radius: 999px; border: 0; padding: 0 14px; background: #ffb15a; color: #3a1604; }
    .hidden { display: none !important; }
    .guide {
      position: fixed; z-index: 4; left: 50%; top: 42%; transform: translate(-50%, -50%);
      width: min(280px, calc(100% - 48px)); text-align: center; pointer-events: none;
      padding: 16px; border-radius: 18px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.12);
      opacity: 0; transition: opacity 0.6s ease;
    }
  </style>
</head>
<body>
  <canvas id="art"></canvas>
  <section class="screen" id="start">
    <p class="eyebrow">KOTODAMA LANTERN</p>
    <div>
      <h1>言霊ランタン</h1>
      <p class="lead">
        冷たい言葉の流れを、息か指先で灯に変える。
        <span>置いたうれしい言葉は、燃え尽きずに残ります。</span>
      </p>
    </div>
    <button class="go" id="startBtn" type="button">灯りをともす</button>
  </section>
  <p class="guide" id="guide">瓶に入れ、息を吹きかけるか<br>画面を押してください</p>
  <div class="hud hidden" id="hud">
    <button class="icon" id="breathBtn" type="button">息</button>
    <button class="icon" id="soundBtn" type="button" aria-label="音">♪</button>
  </div>
  <form class="dock hidden" id="dock">
    <div class="chips" id="chips"></div>
    <div class="composer" id="composer">
      <input id="word" maxlength="24" enterkeyhint="send" autocomplete="off" placeholder="うれしい言葉を置く" style="font-size:16px">
      <button class="send" type="submit">灯す</button>
    </div>
    <p class="hint" id="noiseHint">NOISE</p>
  </form>
  <div class="install hidden" id="install">
    <div>ホーム画面に追加すると、このランタンをアプリとして開けます。共有ボタンから「ホーム画面に追加」。</div>
    <button type="button" id="installClose">わかった</button>
  </div>
  <script>
    const NOISE = ["未読 99+", "既読", "通知", "比較", "炎上", "タイムライン", "最適化", "広告", "焦燥", "FEED", "ALERT", "NOISE"];
    const JOY = ["嬉しい", "ありがとう", "大好き", "きらきら", "笑顔", "あったかい", "光", "幸せ", "輝く", "♡"];
    const STORE = "kotodama-words-v1";
    const canvas = document.getElementById("art");
    const ctx = canvas.getContext("2d");
    const state = { on: false, sound: true, warmth: 0, breath: 0, w: 1, h: 1, words: [] };
    const cold = [];
    const embers = [];
    const shards = [];
    const kept = [];
    let audioCtx = null, micOn = false, analyser = null, micData = null, shock = 0, composing = false, lastMove = 0;

    function resize() {
      state.w = innerWidth; state.h = innerHeight;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(state.w * dpr);
      canvas.height = Math.floor(state.h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function loadWords() {
      try { state.words = JSON.parse(localStorage.getItem(STORE) || "[]").filter(w => typeof w === "string").slice(0, 16); }
      catch { state.words = []; }
      state.words.forEach(spawnKept);
    }
    function saveWords() { try { localStorage.setItem(STORE, JSON.stringify(state.words)); } catch {} }
    function renderChips() {
      const box = document.getElementById("chips");
      box.replaceChildren();
      state.words.forEach(text => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = text;
        b.addEventListener("click", () => burst(text, state.w / 2, state.h * 0.42, 0.85));
        box.appendChild(b);
      });
    }
    function spawnKept(text) {
      kept.push({ text, x: Math.random() * state.w, y: state.h * (0.25 + Math.random() * 0.35), p: Math.random() * 6, a: 0.55 });
    }
    function burst(text, x, y, power) {
      const n = Math.round((state.w < 760 ? 20 : 32) * power);
      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n;
        const sp = (5 + Math.random() * 8) * power;
        shards.push({ text: i % 3 === 0 ? text : JOY[i % JOY.length], x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, size: i % 3 === 0 ? 22 : 15, hue: i % 3 === 0 ? 32 : (i % 4 ? 24 : 345) });
      }
      shock = Math.max(shock, power);
      state.warmth = Math.min(1, state.warmth + 0.34 * power);
      state.breath = Math.max(state.breath, power);
      playJoy();
      while (shards.length > 180) shards.shift();
    }
    function offer(raw) {
      const text = String(raw || "").trim().slice(0, 24);
      if (!text) return;
      state.words = [text, ...state.words.filter(w => w !== text)].slice(0, 16);
      saveWords(); renderChips(); spawnKept(text);
      document.getElementById("word").value = "";
      document.getElementById("word").blur();
      burst(text, state.w / 2, state.h * 0.42, 1);
    }
    function ensureAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AC) audioCtx = new AC();
      return audioCtx;
    }
    function playJoy() {
      const ac = ensureAudio();
      if (!ac || !state.sound) return;
      if (ac.state === "suspended") ac.resume();
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        const t = ac.currentTime + i * 0.05;
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; o.type = "sine";
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.42);
      });
    }
    async function enableMic() {
      ensureAudio();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        micData = new Uint8Array(analyser.frequencyBinCount);
        micOn = true;
        document.getElementById("breathBtn").textContent = "息";
      } catch { micOn = false; }
    }
    function micLevel() {
      if (!micOn || !analyser) return 0;
      analyser.getByteTimeDomainData(micData);
      let s = 0;
      for (let i = 0; i < micData.length; i++) { const n = (micData[i] - 128) / 128; s += n * n; }
      const rms = Math.sqrt(s / micData.length);
      return rms > 0.04 ? Math.min(1.2, (rms - 0.04) * 8) : 0;
    }
    function makeCold(y) {
      return { text: NOISE[Math.floor(Math.random() * NOISE.length)], x: Math.random() * state.w, y: y == null ? -30 : y, v: 1.2 + Math.random() * 2.8, size: 12 + Math.random() * 8, a: 0.35 + Math.random() * 0.5 };
    }
    function frame(now) {
      requestAnimationFrame(frame);
      if (state.on) {
        const input = Math.max(micLevel(), state.breath);
        if (input > 0.05) {
          state.warmth = Math.min(1, state.warmth + input * 0.012);
          lastMove = now;
        }
        state.breath *= 0.94;
        if (now - lastMove > 14000) state.warmth = Math.max(0, state.warmth - 0.0015);
        const noise = Math.round((1 - state.warmth) * 100);
        document.getElementById("noiseHint").textContent = noise > 8 ? `冷たい言葉 ${noise}%` : "ランタン";
      }
      shock *= 0.96;
      const w = state.warmth;
      ctx.fillStyle = `rgb(${Math.round(6 + 48 * w)}, ${Math.round(8 + 18 * w)}, ${Math.round(16 - 10 * w)})`;
      ctx.fillRect(0, 0, state.w, state.h);
      if (w > 0.01 || shock > 0.02) {
        const pulse = 0.75 + Math.sin(now / 700) * 0.06 + shock * 0.4;
        const g = ctx.createRadialGradient(state.w / 2, state.h * 0.55, 12, state.w / 2, state.h * 0.5, Math.max(state.w, state.h) * 0.75);
        g.addColorStop(0, `rgba(255, 214, 150, ${0.55 * pulse * (0.25 + w)})`);
        g.addColorStop(0.35, `rgba(255, 120, 40, ${0.28 * pulse * (0.2 + w)})`);
        g.addColorStop(1, "rgba(20,6,2,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, state.w, state.h);
      }
      cold.forEach(c => {
        c.y += c.v * (1 + (1 - w));
        if (w > 0.08 && Math.random() < w * 0.04 + state.breath * 0.15) {
          embers.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 1.2, vy: -1.4 - Math.random() * 2, life: 1, hue: 24 + Math.random() * 20 });
          Object.assign(c, makeCold(-20));
        }
        if (c.y > state.h + 20) Object.assign(c, makeCold(-20));
        ctx.globalAlpha = c.a * Math.max(0, 1 - w * 1.2);
        ctx.fillStyle = "rgba(170, 220, 255, 0.9)";
        ctx.font = `${c.size}px Inter, sans-serif`;
        ctx.fillText(c.text, c.x, c.y);
        ctx.globalAlpha = 1;
      });
      kept.forEach(k => {
        k.p += 0.008; k.y -= 0.15; if (k.y < 40) k.y = state.h * 0.72;
        k.x += Math.sin(k.p) * 0.35;
        ctx.globalAlpha = 0.35 + w * 0.55;
        ctx.fillStyle = "#ffe1b0";
        ctx.font = "18px 'Shippori Mincho', serif";
        ctx.fillText(k.text, k.x, k.y);
        ctx.globalAlpha = 1;
      });
      ctx.globalCompositeOperation = "lighter";
      for (let i = embers.length - 1; i >= 0; i--) {
        const e = embers[i];
        e.x += e.vx; e.y += e.vy; e.vy -= 0.01; e.life -= 0.008;
        if (e.life <= 0) { embers.splice(i, 1); continue; }
        ctx.fillStyle = `hsla(${e.hue},100%,68%,${e.life})`;
        ctx.beginPath(); ctx.arc(e.x, e.y, 2.4 + e.life * 3, 0, Math.PI * 2); ctx.fill();
      }
      for (let i = shards.length - 1; i >= 0; i--) {
        const s = shards[i];
        s.x += s.vx; s.y += s.vy; s.vx *= 0.985; s.vy = s.vy * 0.985 - 0.02; s.life -= 0.008;
        if (s.life <= 0) { shards.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, s.life);
        ctx.fillStyle = `hsl(${s.hue} 95% 72%)`;
        ctx.font = `${s.size}px 'Shippori Mincho', serif`;
        ctx.textAlign = "center";
        ctx.fillText(s.text, s.x, s.y);
      }
      ctx.globalAlpha = 1; ctx.textAlign = "start"; ctx.globalCompositeOperation = "source-over";
    }
    function lift() {
      const vv = window.visualViewport;
      if (!vv) return;
      const covered = Math.max(0, innerHeight - vv.height - vv.offsetTop);
      document.getElementById("dock").style.transform = covered ? `translateY(-${covered}px)` : "";
    }
    document.getElementById("startBtn").addEventListener("click", () => {
      state.on = true; lastMove = performance.now(); ensureAudio();
      const start = document.getElementById("start");
      start.style.opacity = "0"; start.style.pointerEvents = "none";
      document.getElementById("dock").classList.remove("hidden");
      document.getElementById("hud").classList.remove("hidden");
      const guide = document.getElementById("guide");
      guide.style.opacity = "1";
      setTimeout(() => { guide.style.opacity = "0"; start.classList.add("hidden"); }, 2800);
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
      if (ios && !standalone) document.getElementById("install").classList.remove("hidden");
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    });
    document.getElementById("dock").addEventListener("submit", (e) => { e.preventDefault(); if (!composing) offer(document.getElementById("word").value); });
    document.getElementById("word").addEventListener("compositionstart", () => composing = true);
    document.getElementById("word").addEventListener("compositionend", () => composing = false);
    document.getElementById("soundBtn").addEventListener("click", () => {
      state.sound = !state.sound;
      document.getElementById("soundBtn").textContent = state.sound ? "♪" : "×";
    });
    document.getElementById("breathBtn").addEventListener("click", enableMic);
    document.getElementById("installClose").addEventListener("click", () => document.getElementById("install").classList.add("hidden"));
    canvas.addEventListener("pointerdown", (e) => {
      if (!state.on) return;
      state.breath = 1;
      const word = state.words[0];
      if (word) burst(word, e.clientX, e.clientY, 0.55);
    });
    addEventListener("resize", resize);
    visualViewport?.addEventListener("resize", lift);
    visualViewport?.addEventListener("scroll", lift);
    resize(); loadWords(); renderChips();
    for (let i = 0; i < 48; i++) cold.push(makeCold(Math.random() * state.h));
    requestAnimationFrame(frame);
  </script>
</body>
</html>
