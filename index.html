<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>潮汐の翻訳者</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #061018; color: #e7eef6;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      touch-action: manipulation; overscroll-behavior: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; }
    .spots {
      position: fixed; z-index: 5; left: 0; right: 0;
      top: calc(8px + env(safe-area-inset-top));
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 12px 8px;
      scrollbar-width: none; touch-action: pan-x;
    }
    .spots::-webkit-scrollbar { display: none; }
    .spot {
      flex: 0 0 auto; min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: #d5e4ef;
      border: 1px solid rgba(180, 210, 230, 0.25); background: rgba(8, 16, 28, 0.72);
    }
    .spot.active { border-color: #dfb15b; color: #ffe7b8; }
    .note {
      position: fixed; z-index: 4; left: 16px; right: 16px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      font-family: "Shippori Mincho", serif; letter-spacing: 0.12em; font-size: 13px;
      color: rgba(223, 177, 91, 0.8); pointer-events: none; text-shadow: 0 2px 12px #000;
    }
    button { font: inherit; color: inherit; background: transparent; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="tide"></canvas>
  <div class="spots" id="spots"></div>
  <p class="note" id="note">山梨の数字を、水が読む前に</p>
  <script>
    const PLACES = [
      { id: "kawaguchi", name: "河口湖", area: "富士五湖", kind: "湖", lat: 35.517, lon: 138.755 },
      { id: "yamanaka", name: "山中湖", area: "富士五湖", kind: "湖", lat: 35.416, lon: 138.877 },
      { id: "sai", name: "西湖", area: "富士五湖", kind: "湖", lat: 35.498, lon: 138.685 },
      { id: "shoji", name: "精進湖", area: "富士五湖", kind: "湖", lat: 35.493, lon: 138.608 },
      { id: "motosu", name: "本栖湖", area: "富士五湖", kind: "湖", lat: 35.463, lon: 138.585 },
      { id: "kofu", name: "甲府", area: "釜無川", kind: "川", lat: 35.664, lon: 138.568 },
      { id: "isawa", name: "石和", area: "笛吹川", kind: "川", lat: 35.640, lon: 138.640 },
      { id: "otsuki", name: "大月", area: "桂川", kind: "川", lat: 35.610, lon: 138.940 },
      { id: "shosen", name: "昇仙峡", area: "荒川", kind: "川", lat: 35.753, lon: 138.560 },
      { id: "minobu", name: "身延", area: "富士川", kind: "川", lat: 35.364, lon: 138.452 },
      { id: "fujiyoshida", name: "富士吉田", area: "富士山麓", kind: "麓", lat: 35.488, lon: 138.808 },
      { id: "hokuto", name: "北杜", area: "八ヶ岳", kind: "麓", lat: 35.776, lon: 138.423 }
    ];
    const CLAIMS = ["この数字は確かだ", "明日の川は読める", "湖は管理されている", "警報の外は安全だ"];
    const canvas = document.getElementById("tide");
    const ctx = canvas.getContext("2d");
    let width = 1, height = 1, anim = 0, place = PLACES[0];
    let waveH = 0.8, caprice = 0, glyphs = [], finger = { x: -9999, y: -9999, down: false };
    let lines = [], reformAt = 0, shown = false;

    function resize() {
      width = innerWidth;
      height = innerHeight;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layout();
    }
    function sky(code) {
      if (code === 0) return "快晴";
      if (code <= 3) return "曇り";
      if (code === 45 || code === 48) return "霧";
      if (code >= 51 && code <= 67) return "雨";
      if (code >= 71 && code <= 77) return "雪";
      if (code >= 80 && code <= 82) return "驟雨";
      if (code >= 95) return "雷";
      return "空";
    }
    function layout() {
      glyphs = [];
      const left = width < 720 ? 18 : Math.max(18, width * 0.34);
      const top = Math.max(108, height * 0.2);
      ctx.font = "17px 'Shippori Mincho', serif";
      lines.forEach((line, li) => {
        let x = left;
        for (const ch of line) {
          if (ch === " ") { x += 12; continue; }
          glyphs.push({
            ch, x, y: top + li * 36,
            vx: 0, vy: 0, rot: 0, vr: 0, dead: false, a: 1,
            gold: li === 0 || li === lines.length - 1
          });
          x += ctx.measureText(ch).width + 1.2;
        }
      });
    }
    function waveY(x) {
      const base = height * 0.62 - caprice * height * 0.24;
      const amp = 18 + waveH * 28 + caprice * height * 0.1;
      const w1 = Math.sin(x * 0.0042 + anim * 0.35);
      const steep = Math.pow(Math.max(0, (w1 + 1) / 2), 1.8);
      return base - steep * amp - Math.cos(x * 0.009 - anim * 0.28) * amp * 0.25;
    }
    async function load(next) {
      place = next;
      document.querySelectorAll(".spot").forEach((el) => el.classList.toggle("active", el.dataset.id === place.id));
      document.getElementById("note").textContent = `${place.name}の数字を、水が読む前に`;
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,precipitation,rain,weather_code,wind_speed_10m&timezone=Asia%2FTokyo`;
      const floodUrl = `https://flood-api.open-meteo.com/v1/flood?latitude=${place.lat}&longitude=${place.lon}&daily=river_discharge&forecast_days=1&timezone=Asia%2FTokyo`;
      try {
        const jobs = [fetch(weatherUrl).then((res) => res.json())];
        if (place.kind === "川") jobs.push(fetch(floodUrl).then((res) => res.json()));
        const [weather, flood] = await Promise.all(jobs);
        const current = weather.current;
        if (!current) throw new Error("empty");
        const discharge = flood && flood.daily && flood.daily.river_discharge ? flood.daily.river_discharge[0] : null;
        const rain = Number(current.precipitation) || 0;
        const wind = Number(current.wind_speed_10m) || 0;
        waveH = place.kind === "川" && discharge != null
          ? Math.min(2.8, 0.35 + Number(discharge) / 28)
          : Math.min(2.2, 0.4 + rain * 1.1 + wind / 36);
        lines = [
          `${place.name}  ${place.area}`,
          `${sky(current.weather_code)}  気温 ${Number(current.temperature_2m).toFixed(1)}°C`,
          `降水 ${rain.toFixed(1)}mm  風 ${Math.round(wind)}km/h`,
          place.kind === "川" && discharge != null ? `流量 ${Number(discharge).toFixed(2)} m³/s` : `標高 ${Math.round(weather.elevation)}m`,
          CLAIMS[Math.floor(anim) % CLAIMS.length],
          "水は、翻訳を残さない"
        ];
        layout();
      } catch (err) {
        lines = [`${place.name}  ${place.area}`, "数字は届かない。水だけが来る", "水は、翻訳を残さない"];
        waveH = 0.9;
        layout();
      }
    }
    function drawWater() {
      ctx.beginPath();
      ctx.moveTo(0, height);
      for (let x = 0; x <= width; x += 8) ctx.lineTo(x, waveY(x));
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fillStyle = caprice > 0.6 ? "rgba(10, 22, 34, 0.94)" : "rgba(6, 14, 24, 0.9)";
      ctx.fill();
      ctx.strokeStyle = caprice > 0.8 ? "rgba(255, 236, 204, 0.95)" : "rgba(214, 228, 238, 0.82)";
      ctx.lineWidth = 2 + caprice * 2;
      ctx.stroke();
    }
    function loop() {
      requestAnimationFrame(loop);
      anim += 0.02;
      if (!shown && anim > 2.4) {
        shown = true;
        caprice = Math.max(caprice, 1.15);
      }
      if (Math.random() < 0.004) caprice = Math.max(caprice, 0.85 + Math.random() * 1.5);
      caprice *= 0.992;
      ctx.clearRect(0, 0, width, height);
      let alive = 0;
      glyphs.forEach((g) => {
        const hit = g.y > waveY(g.x) - 8 || (caprice > 0.85 && g.y > height * 0.16) || (finger.down && Math.hypot(g.x - finger.x, g.y - finger.y) < 46);
        if (!g.dead && hit) {
          g.dead = true;
          g.vx = (Math.random() - 0.5) * (2 + caprice * 4);
          g.vy = 0.6 + Math.random() * 2.4;
          g.vr = (Math.random() - 0.5) * 0.12;
        }
        if (g.dead) {
          g.vy += 0.04;
          g.vx *= 0.98;
          g.x += g.vx;
          g.y += g.vy;
          g.rot += g.vr;
          g.a -= 0.004 + caprice * 0.004;
        } else alive++;
        if (g.a > 0.03) {
          ctx.save();
          ctx.translate(g.x, g.y);
          ctx.rotate(g.rot);
          ctx.globalAlpha = Math.max(0, g.a);
          ctx.fillStyle = g.gold ? "#dfb15b" : "#e7eef6";
          ctx.font = "17px 'Shippori Mincho', serif";
          ctx.fillText(g.ch, 0, 0);
          ctx.restore();
        }
      });
      drawWater();
      if (glyphs.length && alive === 0 && performance.now() > reformAt) {
        document.getElementById("note").textContent = "何も残らない。県は、また数字を書く。";
        reformAt = performance.now() + 1700;
        setTimeout(() => {
          document.getElementById("note").textContent = `${place.name}の数字を、水がまた書く`;
          layout();
        }, 1500);
      }
    }
    function spots() {
      const box = document.getElementById("spots");
      PLACES.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "spot" + (item === place ? " active" : "");
        button.dataset.id = item.id;
        button.textContent = `${item.name} ${item.area}`;
        button.addEventListener("click", () => load(item));
        box.appendChild(button);
      });
    }
    canvas.addEventListener("pointerdown", (e) => { finger.down = true; finger.x = e.clientX; finger.y = e.clientY; });
    canvas.addEventListener("pointermove", (e) => { if (finger.down) { finger.x = e.clientX; finger.y = e.clientY; } });
    addEventListener("pointerup", () => { finger.down = false; finger.x = -9999; });
    addEventListener("resize", resize);
    lines = ["河口湖  富士五湖", "数字を読んでいます", "この数字は確かだ", "水は、翻訳を残さない"];
    spots();
    resize();
    load(place);
    loop();
    setInterval(() => load(place), 10 * 60 * 1000);
  </script>
</body>
</html>
